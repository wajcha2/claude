name: LeBrun-Salamon parametrized base change and formal arc

on:
  push:
    branches:
      - codex/lebrun-model-frontier-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  parametrized-arc:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact immutable snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        timeout-minutes: 12
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download verified native cache 1 from 41820797837
        uses: actions/download-artifact@v4
        with:
          name: lebrun-formal-arc-model-normalization-41820797837-1
          run-id: 41820797837
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Download verified native cache 2 from 41820797837
        uses: actions/download-artifact@v4
        with:
          name: lebrun-model-contact-factor-41820797837-1
          run-id: 41820797837
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/1
      - name: Restore only exact coherent native artifact union
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Check exact independent parametrized base-change prefix
        id: prefix
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSParametrizedBaseChange --keep-going --timeout 300
      - name: Report exact prefix native scope
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve prefix output before formal-arc check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-parametrized-base-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Check actual formal-arc transport with complete dependencies
        id: arc
        if: steps.prefix.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFormalArcModelTransport --keep-going --timeout 300
      - name: Report actual formal-arc outcomes
        if: always() && steps.prefix.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve complete native frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-parametrized-formal-arc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Require both actual native stages
        if: always()
        env:
          PREFIX_OUTCOME: ${{ steps.prefix.outcome }}
          ARC_OUTCOME: ${{ steps.arc.outcome }}
        run: |
          test "$PREFIX_OUTCOME" = success
          test "$ARC_OUTCOME" = success

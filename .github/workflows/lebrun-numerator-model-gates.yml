name: LeBrun numerator and model comparison gates
on:
  push:
    branches: [codex/lebrun-numerator-model-gates-20261104]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lebrun-numerator-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  numerator_model_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact immutable snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        timeout-minutes: 12
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download verified native cache 1 from 41856517767
        uses: actions/download-artifact@v4
        with:
          name: lebrun-covered-pair-actual-41856517767-1
          run-id: 41856517767
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Restore only exact coherent native artifact union
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Check actual original numerator transport
        id: numerator_actual
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSModelNumeratorTransport --keep-going --timeout 300
      - name: Report numerator_actual exact native scope
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve numerator_actual exact evidence before continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-numerator-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Profile exact five model comparison declarations
        id: model_profile
        if: steps.numerator_actual.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSModelGenericComparisonProfile --keep-going --timeout 300
      - name: Report model_profile exact native scope
        if: always() && steps.numerator_actual.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Expose model_profile receipt-bound raw markers
        if: always() && steps.numerator_actual.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_profile_streams.py --build-dir kernel-evidence --module LSModelGenericComparisonProfile --allow-unattempted
      - name: Preserve model_profile exact evidence before continuation
        if: always() && steps.numerator_actual.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-model5-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Check actual five model comparison declarations
        id: model_actual
        if: steps.model_profile.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSModelGenericComparison --keep-going --timeout 300
      - name: Report model_actual exact native scope
        if: always() && steps.model_profile.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve model_actual exact evidence before continuation
        if: always() && steps.model_profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-model5-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Require actual numerator and model gate outcomes
        if: always()
        run: |
          test "${{ steps.numerator_actual.outcome }}" = success
          test "${{ steps.model_profile.outcome }}" = success
          test "${{ steps.model_actual.outcome }}" = success

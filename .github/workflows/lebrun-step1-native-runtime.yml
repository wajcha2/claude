name: LeBrun-Salamon Step 1 native runtime

on:
  push:
    branches:
      - codex/lebrun-step1-native-runtime-20261101

permissions:
  contents: read

jobs:
  build-native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact mathlib revision
        uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 116662aa4c1e9106ab5c609b3214b02f6e11a65a
          path: mathlib
          fetch-depth: 1

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/leanprover/lean4/releases/download/v4.36.0-rc1/lean-4.36.0-rc1-linux.tar.zst \
            --output lean.tar.zst
          printf '%s  %s\n' \
            '26b3cea1a006ad419215520b8668dcd3f6a9eeba1a123756563a739f9c6274b2' \
            lean.tar.zst | sha256sum --check --strict
          mkdir lean
          tar --use-compress-program=unzstd -xf lean.tar.zst -C lean --strip-components=1
          echo "$GITHUB_WORKSPACE/lean/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/lean/bin/lean" --version
          "$GITHUB_WORKSPACE/lean/bin/lake" --version

      - name: Restore exact cache and build native facets
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/lean/bin:$PATH"
          cd mathlib
          lake exe cache get
          test "$(sha256sum .lake/build/lib/lean/Mathlib.olean | awk '{print $1}')" = \
            'cf4e1b9c97a496d1a653ac6ebe1abfac5b62e8f6a3e442041b5d8845789e09bf'
          lake build

      - name: Verify direct Lean runtime
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/lean/bin:$PATH"
          cat > smoke.lean <<'EOF'
          import Mathlib
          #check Nat
          #check Mathlib.Meta.NormNum
          EOF
          roots=("$GITHUB_WORKSPACE/mathlib/.lake/build/lib/lean")
          libs=("$GITHUB_WORKSPACE/mathlib/.lake/build/lib" "$GITHUB_WORKSPACE/lean/lib/lean" "$GITHUB_WORKSPACE/lean/lib")
          for d in "$GITHUB_WORKSPACE"/mathlib/.lake/packages/*/.lake/build/lib/lean; do roots+=("$d"); done
          for d in "$GITHUB_WORKSPACE"/mathlib/.lake/packages/*/.lake/build/lib; do libs+=("$d"); done
          LEAN_PATH="$(IFS=:; echo "${roots[*]}")" \
          LD_LIBRARY_PATH="$(IFS=:; echo "${libs[*]}")" \
            "$GITHUB_WORKSPACE/lean/bin/lean" smoke.lean | tee direct-smoke.log
          cd mathlib
          lake env lean "$GITHUB_WORKSPACE/smoke.lean" | tee "$GITHUB_WORKSPACE/lake-env-smoke.log"

      - name: Assemble native runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-runtime
          cd mathlib
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "$GITHUB_WORKSPACE/native-runtime/$(dirname "$rel")"
            cp -a "$f" "$GITHUB_WORKSPACE/native-runtime/$rel"
          done < <(find .lake/build .lake/packages -type f \
            \( -name '*.so' -o -name '*.a' -o -name '*.o' \) -print0)
          cd "$GITHUB_WORKSPACE"
          cp direct-smoke.log lake-env-smoke.log native-runtime/
          find native-runtime -type f -print0 | sort -z | xargs -0 sha256sum > native-runtime/FILES.sha256
          find native-runtime -type f -printf '%p %s bytes\n' | sort > native-runtime/FILES.txt
          du -sh native-runtime
          tar -I 'zstd -T0 -12' -cf mathlib-native-runtime.tar.zst native-runtime
          sha256sum mathlib-native-runtime.tar.zst > mathlib-native-runtime.sha256
          split --bytes=100000000 --numeric-suffixes=0 --suffix-length=2 \
            mathlib-native-runtime.tar.zst mathlib-native-runtime.part-
          sha256sum mathlib-native-runtime.part-* > mathlib-native-runtime.parts.sha256
          cat mathlib-native-runtime.sha256 mathlib-native-runtime.parts.sha256

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-native-runtime-manifest
          path: |
            mathlib-native-runtime.sha256
            mathlib-native-runtime.parts.sha256
            native-runtime/FILES.sha256
            native-runtime/FILES.txt
            direct-smoke.log
            lake-env-smoke.log
          if-no-files-found: error

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-00, path: mathlib-native-runtime.part-00, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-01, path: mathlib-native-runtime.part-01, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-02, path: mathlib-native-runtime.part-02, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-03, path: mathlib-native-runtime.part-03, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-04, path: mathlib-native-runtime.part-04, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-05, path: mathlib-native-runtime.part-05, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-06, path: mathlib-native-runtime.part-06, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-07, path: mathlib-native-runtime.part-07, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-08, path: mathlib-native-runtime.part-08, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with: {name: mathlib-native-runtime-part-09, path: mathlib-native-runtime.part-09, compression-level: 0, if-no-files-found: ignore}

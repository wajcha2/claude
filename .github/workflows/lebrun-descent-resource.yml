name: LeBrun-Salamon exact Descent resource check

on:
  push:
    branches:
      - codex/lebrun-descent-resource-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  descent:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact diagnostic snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download the exact validated253-module context
        uses: actions/download-artifact@v4
        with:
          name: lebrun-current-full-41782933633-1
          run-id: 41782933633
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lebrun-prior-evidence
      - name: Restore only exact current ancestry and runtime matches
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --artifact-dir "$RUNNER_TEMP/lebrun-prior-evidence" --build-dir kernel-evidence --source-run-id 41782933633 --source-artifact-name lebrun-current-full-41782933633-1
      - name: Check the measured-cost Descent refactor and continue its branch
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFamilyReparametrization --keep-going --timeout 600
      - name: Expose exact native diagnostics and revalidated receipts
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve exact Descent resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-descent-resource-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn

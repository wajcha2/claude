name: LeBrun-Salamon model frontier

on:
  push:
    branches:
      - codex/lebrun-model-frontier-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  family-descent-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact immutable snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        timeout-minutes: 12
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download verified native cache 1 from 41827757215
        uses: actions/download-artifact@v4
        with:
          name: lebrun-formal-arc-equation-actual-41827757215-1
          run-id: 41827757215
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Restore only exact coherent native artifact union
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Check exact original two point-value proofs
        id: points
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFamilySmoothPointValues --keep-going --timeout 300
      - name: Report original point-value native evidence
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Upload original point-value output before tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-family-smooth-point-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Check actual remaining 52 descent declarations
        id: descent
        if: steps.points.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFamilyBivectorDescent --keep-going --timeout 300
      - name: Report actual descent native evidence
        if: always() && steps.points.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Upload exact descent native evidence
        if: always() && steps.points.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-family-descent-tail-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Require both actual native stages to pass
        if: always()
        env:
          POINTS_OUTCOME: ${{ steps.points.outcome }}
          DESCENT_OUTCOME: ${{ steps.descent.outcome }}
        run: |
          test "$POINTS_OUTCOME" = success
          test "$DESCENT_OUTCOME" = success

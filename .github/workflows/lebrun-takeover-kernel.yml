name: LeBrun-Salamon targeted smoothing checks

on:
  push:
    branches:
      - codex/lebrun-takeover-audit-20261103
    paths:
      - lebrun-salamon/continuation/source/**
      - lebrun-salamon/continuation/scripts/**
      - .github/workflows/lebrun-takeover-kernel.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4

      - name: Restore pinned runtime without rebuilding mathlib
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py \
            --runtime "$RUNNER_TEMP/lebrun-runtime" \
            --config "$GITHUB_WORKSPACE/runtime-config.json"

      - name: Download prior native compiler evidence
        uses: actions/download-artifact@v4
        with:
          name: lebrun-takeover-early-smoothing-41769360325-1
          run-id: 41769360325
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lebrun-prior-evidence

      - name: Restore only exact source and runtime matches
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache.py \
            --root lebrun-salamon/continuation \
            --runtime-config runtime-config.json \
            --artifact-dir "$RUNNER_TEMP/lebrun-prior-evidence" \
            --build-dir kernel-evidence \
            --source-run-id 41769360325 \
            --source-artifact-name lebrun-takeover-early-smoothing-41769360325-1

      - name: Check only the current smoothing closure
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py \
            --root lebrun-salamon/continuation \
            --runtime-config runtime-config.json \
            --build-dir kernel-evidence \
            --module LSSmoothingAssembly --keep-going --timeout 900

      - name: Preserve early smoothing closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-takeover-early-smoothing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            kernel-evidence/
          if-no-files-found: warn


name: LeBrun-Salamon independent family frontiers

on:
  push:
    branches:
      - codex/lebrun-family-independent-frontiers-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smooth-descent-measured-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact immutable snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        timeout-minutes: 12
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download verified native cache 1 from 41833502528
        uses: actions/download-artifact@v4
        with:
          name: lebrun-family-fibres37-41833502528-1
          run-id: 41833502528
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Restore only exact coherent native artifact union
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Profile exact52 with measured cumulative budget
        id: descent_profile
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFamilyDescentTailProfile --keep-going --timeout 420
      - name: Report descent_profile exact native scope
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Expose descent_profile receipt-bound raw markers
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_profile_streams.py --build-dir kernel-evidence --module LSFamilyDescentTailProfile --allow-unattempted
      - name: Preserve descent_profile exact evidence before continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-descent52-420-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Check exact uninstrumented52 after complete profile
        id: descent_actual
        if: steps.descent_profile.outcome == 'success'
        continue-on-error: true
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFamilyBivectorDescent --keep-going --timeout 420
      - name: Report descent_actual exact native scope
        if: always() && steps.descent_profile.outcome == 'success'
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve descent_actual exact evidence before continuation
        if: always() && steps.descent_profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-descent52-420-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
      - name: Require both native outcomes
        if: always()
        env:
          PROFILE_OUTCOME: ${{ steps.descent_profile.outcome }}
          ACTUAL_OUTCOME: ${{ steps.descent_actual.outcome }}
        run: |
          test "$PROFILE_OUTCOME" = success
          test "$ACTUAL_OUTCOME" = success

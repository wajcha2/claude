name: LeBrun-Salamon formal-arc normalization and archived profile report

on:
  push:
    branches:
      - codex/lebrun-formal-arc-normalization-profile-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  formal-arc-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact immutable snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        timeout-minutes: 12
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download verified native cache 1 from 41818060468
        uses: actions/download-artifact@v4
        with:
          name: lebrun-model-tensor-scalars-41818060468-1
          run-id: 41818060468
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Restore only exact coherent native artifact union
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Locate the exact original formal-arc normalization boundary
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSFormalArcNormalizationProfile --keep-going --timeout 180
      - name: Expose exact native diagnostics and revalidated receipts
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Expose receipt-bound raw profiler streams
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_profile_streams.py --build-dir kernel-evidence --module LSFormalArcNormalizationProfile --allow-unattempted
      - name: Preserve current native frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-formal-arc-normalization-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn
  preserved-profile-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out receipt-bound stream reader
        uses: actions/checkout@v4
      - name: Download unchanged family diagnostic archive
        uses: actions/download-artifact@v4
        with:
          name: lebrun-family-endpoint-discriminators-41817146860-1
          run-id: 41817146860
          github-token: ${{ github.token }}
          path: preserved-profiles/family
      - name: Download unchanged numerator diagnostic archive
        uses: actions/download-artifact@v4
        with:
          name: lebrun-model-numerator-congruence-profile-41817505301-1
          run-id: 41817505301
          github-token: ${{ github.token }}
          path: preserved-profiles/numerator
      - name: Print all original raw streams without invoking Lean
        run: |
          python3 lebrun-salamon/continuation/scripts/report_profile_streams.py --build-dir preserved-profiles/family/kernel-evidence --module LSFamilyReparamExpansionStages --module LSFamilyReparamLeftExpansion --module LSFamilyReparamLeftOriginalSteps
          python3 lebrun-salamon/continuation/scripts/report_profile_streams.py --build-dir preserved-profiles/numerator/kernel-evidence --module LSModelNumeratorTransportCongruenceProfile

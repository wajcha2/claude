name: LeBrun-Salamon model and formal-arc frontier

on:
  push:
    branches:
      - codex/lebrun-model-frontier-20261104
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact diagnostic snapshot
        uses: actions/checkout@v4
      - name: Verify exact source manifest
        run: python3 lebrun-salamon/continuation/scripts/check_checkpoint.py --root lebrun-salamon/continuation --verify-manifest --output-dir diagnostic-static
      - name: Restore pinned stock runtime
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_ci_runtime.py --runtime "$RUNNER_TEMP/lebrun-runtime" --config "$GITHUB_WORKSPACE/runtime-config.json"
      - name: Download the full verified253-module context
        uses: actions/download-artifact@v4
        with:
          name: lebrun-current-full-41782933633-1
          run-id: 41782933633
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/0
      - name: Download the passed206-module model context
        uses: actions/download-artifact@v4
        with:
          name: lebrun-model-frontier-41791217887-1
          run-id: 41791217887
          github-token: ${{ github.token }}
          path: lebrun-cache-inputs/1
      - name: Restore only exact coherent native artifact unions
        run: |
          python3 lebrun-salamon/continuation/scripts/restore_replay_cache_union.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --inputs lebrun-salamon/continuation/audit/outage_frontier/MODEL_CACHE_INPUTS.json --build-dir kernel-evidence
      - name: Check the actual Differential candidate and preserved formal-arc closure
        run: |
          python3 lebrun-salamon/continuation/scripts/replay_checkpoint.py --root lebrun-salamon/continuation --runtime-config runtime-config.json --build-dir kernel-evidence --module LSModelDifferential --module LSFormalArcSections --keep-going --timeout 180
      - name: Expose exact native diagnostics and revalidated receipts
        if: always()
        run: python3 lebrun-salamon/continuation/scripts/report_native_stage.py
      - name: Preserve model frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lebrun-model-frontier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-config.json
            diagnostic-static/
            kernel-evidence/
          if-no-files-found: warn

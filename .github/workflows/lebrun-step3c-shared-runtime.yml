name: LeBrun-Salamon Step 3c shared runtime

on:
  push:
    branches:
      - codex/lebrun-step3b-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shared-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact mathlib revision
        uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 116662aa4c1e9106ab5c609b3214b02f6e11a65a
          path: mathlib
          fetch-depth: 1

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/leanprover/lean4/releases/download/v4.36.0-rc1/lean-4.36.0-rc1-linux.tar.zst \
            --output lean.tar.zst
          printf '%s  %s\n' \
            '26b3cea1a006ad419215520b8668dcd3f6a9eeba1a123756563a739f9c6274b2' \
            lean.tar.zst | sha256sum --check --strict
          mkdir lean
          tar --use-compress-program=unzstd -xf lean.tar.zst -C lean --strip-components=1
          echo "$GITHUB_WORKSPACE/lean/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/lean/bin/lean" --version
          "$GITHUB_WORKSPACE/lean/bin/lake" --version

      - name: Restore exact cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/lean/bin:$PATH"
          cd mathlib
          lake exe cache get
          test "$(sha256sum .lake/build/lib/lean/Mathlib.olean | awk '{print $1}')" = \
            'cf4e1b9c97a496d1a653ac6ebe1abfac5b62e8f6a3e442041b5d8845789e09bf'

      - name: Build shared libraries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/lean/bin:$PATH"
          cd mathlib
          lake build Batteries:shared
          lake build Qq:shared
          lake build Aesop:shared
          lake build ProofWidgets:shared
          lake build Mathlib:shared

      - name: Verify project-style direct Lean import
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/lean/bin:$PATH"
          cat > smoke.lean <<'EOF'
          import Mathlib
          open Batteries
          #check Lean.registerTagAttributeExtra
          example : True := by trivial
          EOF
          cd mathlib
          lake env lean "$GITHUB_WORKSPACE/smoke.lean" | tee "$GITHUB_WORKSPACE/smoke.log"

      - name: Package shared runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shared-runtime
          cd mathlib
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "$GITHUB_WORKSPACE/shared-runtime/$(dirname "$rel")"
            cp -a "$f" "$GITHUB_WORKSPACE/shared-runtime/$rel"
          done < <(find .lake/build .lake/packages -type f -name '*.so' -print0)
          cd "$GITHUB_WORKSPACE"
          cp smoke.log shared-runtime/
          find shared-runtime -type f -print0 | sort -z | xargs -0 sha256sum > shared-runtime/FILES.sha256
          find shared-runtime -type f -printf '%p %s bytes\n' | sort > shared-runtime/FILES.txt
          tar -I 'zstd -T0 -12' -cf mathlib-shared-runtime.tar.zst shared-runtime
          sha256sum mathlib-shared-runtime.tar.zst > mathlib-shared-runtime.sha256
          split --bytes=90000000 --numeric-suffixes=0 --suffix-length=2 \
            mathlib-shared-runtime.tar.zst mathlib-shared-runtime.part-
          sha256sum mathlib-shared-runtime.part-* > mathlib-shared-runtime.parts.sha256
          ls -lh mathlib-shared-runtime.part-* shared-runtime/FILES.txt

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-shared-runtime-manifest
          path: |
            mathlib-shared-runtime.sha256
            mathlib-shared-runtime.parts.sha256
            shared-runtime/FILES.sha256
            shared-runtime/FILES.txt
            smoke.log
          if-no-files-found: error

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-00, path: mathlib-shared-runtime.part-00, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-01, path: mathlib-shared-runtime.part-01, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-02, path: mathlib-shared-runtime.part-02, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-03, path: mathlib-shared-runtime.part-03, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-04, path: mathlib-shared-runtime.part-04, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-05, path: mathlib-shared-runtime.part-05, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-06, path: mathlib-shared-runtime.part-06, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-07, path: mathlib-shared-runtime.part-07, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-08, path: mathlib-shared-runtime.part-08, compression-level: 0, if-no-files-found: ignore}
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with: {name: mathlib-shared-runtime-part-09, path: mathlib-shared-runtime.part-09, compression-level: 0, if-no-files-found: ignore}
